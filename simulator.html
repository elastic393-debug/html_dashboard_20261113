<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パネル基板 リフロー反り高度解析・3Dシミュレーター</title>
    <!-- Three.js (3D Graphics) & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- FontAwesome for UI Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #121319;
            --panel-bg: #1e2029;
            --accent: #00b4d8;
            --accent-hover: #0096c7;
            --text-main: #edf2f4;
            --text-sub: #8d99ae;
            --border-color: #2b2d42;
            --danger: #ef233c;
            --success: #2a9d8f;
            --warning: #e9c46a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar UI */
        #sidebar {
            width: 410px;
            background-color: var(--panel-bg);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            border-right: 1px solid var(--border-color);
            box-shadow: 4px 0 15px rgba(0,0,0,0.4);
            z-index: 10;
        }

        h2 { font-size: 1.15rem; color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 6px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .section { background: rgba(0,0,0,0.25); padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.06); }
        .section-title { font-weight: 600; font-size: 0.85rem; margin-bottom: 8px; color: #a8dede; display: flex; align-items: center; gap: 6px; justify-content: space-between; }

        .form-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.82rem;
        }
        .form-group label { flex: 1; color: var(--text-main); }
        .form-group input, .form-group select {
            width: 110px;
            padding: 5px 8px;
            background: #10141e;
            border: 1px solid #3a3f58;
            color: #fff;
            border-radius: 5px;
            text-align: right;
            font-size: 0.82rem;
            transition: border 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .file-upload {
            border: 2px dashed var(--accent);
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(0, 180, 216, 0.04);
        }
        .file-upload:hover { background: rgba(0, 180, 216, 0.12); border-color: #90e0ef; }
        .file-upload i { font-size: 1.5rem; color: var(--accent); margin-bottom: 4px; }

        button.btn-action {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(0, 180, 216, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        button.btn-action:hover { background-color: var(--accent-hover); }
        button.btn-sample { background-color: #3a86ff; box-shadow: 0 4px 12px rgba(58, 134, 255, 0.3); }
        button.btn-sample:hover { background-color: #2667cc; }

        /* Layer Status Badges */
        .layer-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }
        .layer-tag {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: #2b2d42;
            color: #8d99ae;
        }
        .layer-tag.active {
            background: var(--success);
            color: #fff;
            font-weight: bold;
        }

        /* Main View Canvas */
        #main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #canvas-container {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #0b0c10;
        }

        /* HUD Display */
        #hud {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(22, 24, 33, 0.88);
            backdrop-filter: blur(12px);
            padding: 14px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            min-width: 290px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }

        .hud-item { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.85rem; }
        .hud-value { font-weight: bold; color: #fff; }
        
        .judge-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            text-align: center;
            margin-top: 8px;
            font-size: 0.9rem;
        }
        .judge-ok { background-color: var(--success); color: #fff; }
        .judge-ng { background-color: var(--danger); color: #fff; }
        .judge-warn { background-color: var(--warning); color: #111; }

        /* HUD Mode Toggle Bar */
        #view-controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(22, 24, 33, 0.88);
            backdrop-filter: blur(10px);
            padding: 6px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 6px;
        }
        .view-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-sub);
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .view-btn.active { background: var(--accent); color: #fff; font-weight: bold; }
        .view-btn:hover:not(.active) { color: #fff; background: rgba(255,255,255,0.05); }

        /* Color Bar Legend */
        #legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(22, 24, 33, 0.88);
            backdrop-filter: blur(10px);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.78rem;
        }
        .color-ramp {
            width: 150px;
            height: 12px;
            background: linear-gradient(to right, blue, cyan, green, yellow, red);
            border-radius: 3px;
        }

        /* Loading Spinner Overlay */
        #loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(11, 12, 16, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        #loading-overlay.active { opacity: 1; pointer-events: auto; }
        .spinner {
            width: 36px; height: 36px;
            border: 4px solid rgba(0, 180, 216, 0.2);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text" style="color: #fff; font-size: 0.9rem;">DXFレイヤー解析中...</div>
    </div>

    <!-- Sidebar Input Controls -->
    <div id="sidebar">
        <h2><i class="fa-solid fa-microchip"></i> リフロー反り解析設定</h2>

        <!-- 1. DXF Upload & Sample -->
        <div class="section">
            <div class="section-title"><i class="fa-solid fa-file-code"></i> 1. パネルDXFレイヤー分離データ</div>
            <div class="file-upload" onclick="document.getElementById('dxf-file').click()" id="drop-zone" style="margin-bottom: 8px;">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <div id="file-label" style="font-size: 0.82rem; font-weight: 500;">DXFファイルを指定 / ドロップ</div>
                <small style="color: var(--text-sub); font-size: 0.7rem;">レイヤー別パース対応</small>
                <input type="file" id="dxf-file" accept=".dxf" style="display:none" onchange="handleFileSelect(this.files)">
            </div>
            <button class="btn-action btn-sample" onclick="downloadLayeredSampleDXF()">
                <i class="fa-solid fa-download"></i> レイヤー別サンプルDXF(2x3面付)を出力
            </button>
            <div class="layer-tags">
                <span class="layer-tag" id="tag-panel">PANEL_OUTLINE</span>
                <span class="layer-tag" id="tag-board">BOARD_OUTLINE</span>
                <span class="layer-tag" id="tag-slit">SLIT</span>
                <span class="layer-tag" id="tag-tab">TAB_PERF</span>
            </div>
        </div>

        <!-- 2. Auto-parsed DXF Geometric Info -->
        <div class="section">
            <div class="section-title"><i class="fa-solid fa-vector-square"></i> 2. レイヤー別解析結果</div>
            <div class="form-group"><label>パネル外形 (X × Y):</label><span id="info-panel-size" style="font-weight:600; color:#4ea8de;">-</span></div>
            <div class="form-group"><label>正確な面付数 (pcs):</label><span id="info-pcs-count" style="font-weight:600; color:#4ea8de;">-</span></div>
            <div class="form-group"><label>平均スリット幅:</label><span id="info-slit-width" style="font-weight:600; color:#4ea8de;">-</span></div>
            <div class="form-group"><label>開口・捨て板比率:</label><span id="info-cutout-ratio" style="font-weight:600; color:#4ea8de;">-</span></div>
        </div>

        <!-- 3. Substrate & Layer Parameters -->
        <div class="section">
            <div class="section-title"><i class="fa-solid fa-layer-group"></i> 3. 基板積層・材料設定</div>
            <div class="form-group">
                <label>基材タイプ:</label>
                <select id="mat-type" onchange="runSimulation()">
                    <option value="fr4_standard">標準 FR-4 (Tg 140℃)</option>
                    <option value="fr4_high_tg" selected>高Tg FR-4 (Tg 170℃)</option>
                    <option value="polyimide">ポリイミド (Tg 220℃)</option>
                </select>
            </div>
            <div class="form-group">
                <label>層数 (Layer):</label>
                <input type="number" id="layer-count" value="4" min="1" max="32" onchange="runSimulation()">
            </div>
            <div class="form-group">
                <label>基板板厚 (mm):</label>
                <input type="number" id="board-thick" value="1.6" step="0.1" min="0.2" onchange="runSimulation()">
            </div>
            <div class="form-group">
                <label>銅箔厚 (μm):</label>
                <input type="number" id="copper-thick" value="35" step="5" min="9" onchange="runSimulation()">
            </div>
            <div class="form-group">
                <label>残銅率上下差 (%):</label>
                <input type="number" id="cu-ratio-diff" value="15" step="1" title="Top面とBottom面の残銅率の不均衡性" onchange="runSimulation()">
            </div>
        </div>

        <!-- 4. Component Weight & Reflow Profile -->
        <div class="section">
            <div class="section-title"><i class="fa-solid fa-temperature-arrow-up"></i> 4. 部品重量 & リフロー条件</div>
            <div class="form-group">
                <label>1pcs部品重量 (g):</label>
                <input type="number" id="comp-weight" value="10.0" step="0.5" min="0" onchange="runSimulation()">
            </div>
            <div class="form-group">
                <label>ピーク温度 (°C):</label>
                <input type="number" id="reflow-temp" value="250" step="5" min="150" max="300" onchange="runSimulation()">
            </div>
            <div class="form-group">
                <label>搬送支持形態:</label>
                <select id="support-type" onchange="runSimulation()">
                    <option value="2edge">左右2辺搬送 (コンベア)</option>
                    <option value="4corner">4角支持 (パレット固定)</option>
                </select>
            </div>
        </div>

        <button class="btn-action" onclick="runSimulation()">
            <i class="fa-solid fa-calculator"></i> シミュレーション再計算
        </button>
    </div>

    <!-- Main View Canvas -->
    <div id="main-view">
        <div id="view-controls">
            <button class="view-btn active" onclick="setWireframeMode(false, this)"><i class="fa-solid fa-cube"></i> ソリッド (コンター)</button>
            <button class="view-btn" onclick="setWireframeMode(true, this)"><i class="fa-solid fa-border-all"></i> メッシュワイヤー</button>
            <button class="view-btn" onclick="resetCamera()"><i class="fa-solid fa-arrows-to-dot"></i> 視点リセット</button>
        </div>

        <div id="canvas-container"></div>

        <!-- Result HUD -->
        <div id="hud">
            <div class="hud-item"><span>総搭載部品重量:</span><span class="hud-value" id="res-total-weight">- g</span></div>
            <div class="hud-item"><span>最大反り量 (Z Max):</span><span class="hud-value" id="res-warpage-mm">- mm</span></div>
            <div class="hud-item"><span>反り率 (対角長比):</span><span class="hud-value" id="res-warpage-ratio">- %</span></div>
            <div class="hud-item"><span>許容標準 (IPC-2221):</span><span class="hud-value">0.75 % 以下</span></div>
            <div class="judge-badge" id="res-badge"><i class="fa-solid fa-circle-info"></i> DXF読み込み待ち</div>
        </div>

        <!-- Color Ramp Legend -->
        <div id="legend">
            <span>変位 Min (0mm)</span>
            <div class="color-ramp"></div>
            <span>Max (Z反り)</span>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls, pcbGroup;
        let isWireframe = false;

        let parsedDXF = {
            width: 200,
            height: 150,
            pcsCount: 6,
            slitWidth: 2.0,
            outerPoly: [],
            boardLoops: [],
            totalArea: 25000,
            cutoutRatio: 15.0
        };

        window.addEventListener('load', () => {
            init3D();
            setupDragAndDrop();
            createDefaultBoardGeometry();
        });

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0c10);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 3000);
            camera.position.set(0, -220, 220);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight1.position.set(200, -200, 300);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0x90e0ef, 0.4);
            dirLight2.position.set(-200, 200, -100);
            scene.add(dirLight2);

            const grid = new THREE.GridHelper(600, 60, 0x3a3f58, 0x1a1c23);
            grid.rotation.x = Math.PI / 2;
            scene.add(grid);

            pcbGroup = new THREE.Group();
            scene.add(pcbGroup);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function resetCamera() {
            camera.position.set(0, -Math.max(parsedDXF.width, parsedDXF.height) * 1.3, Math.max(parsedDXF.width, parsedDXF.height) * 1.1);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        function setWireframeMode(wire, btn) {
            isWireframe = wire;
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            runSimulation();
        }

        function setupDragAndDrop() {
            const zone = document.getElementById('drop-zone');
            window.addEventListener('dragover', e => e.preventDefault());
            window.addEventListener('drop', e => e.preventDefault());

            zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.style.background = 'rgba(0, 180, 216, 0.2)'; });
            zone.addEventListener('dragleave', () => { zone.style.background = 'rgba(0, 180, 216, 0.04)'; });
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.style.background = 'rgba(0, 180, 216, 0.04)';
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    handleFileSelect(e.dataTransfer.files);
                }
            });
        }

        function handleFileSelect(files) {
            if (!files || files.length === 0) return;
            const file = files[0];
            document.getElementById('file-label').innerHTML = `<i class="fa-solid fa-file-circle-check"></i> ${file.name}`;

            showLoading(true, "DXFレイヤー別解析中...");

            setTimeout(() => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        parseLayeredDXF(e.target.result);
                        runSimulation();
                    } catch (err) {
                        alert("DXF解析エラー: " + err.message);
                    } finally {
                        showLoading(false);
                    }
                };
                reader.readAsText(file);
            }, 50);
        }

        function showLoading(show, text="解析中...") {
            const overlay = document.getElementById('loading-overlay');
            document.getElementById('loading-text').innerText = text;
            if(show) overlay.classList.add('active');
            else overlay.classList.remove('active');
        }

        // --- レイヤー別DXF厳密パース処理 ---
        function parseLayeredDXF(dxfText) {
            const lines = dxfText.split(/\r?\n/);
            let entities = [];
            let inEntitiesSection = false;
            let currentEntity = null;
            let currentLayer = "0";

            for (let i = 0; i < lines.length; i++) {
                const code = lines[i].trim();
                const val = (i + 1 < lines.length) ? lines[i + 1].trim() : "";

                if (code === '2' && val === 'ENTITIES') {
                    inEntitiesSection = true;
                    i++; continue;
                }
                if (code === '0' && val === 'ENDSEC') {
                    if (inEntitiesSection) {
                        if (currentEntity) entities.push(currentEntity);
                        inEntitiesSection = false;
                    }
                }

                if (inEntitiesSection && code === '0') {
                    if (currentEntity) entities.push(currentEntity);
                    currentEntity = { type: val, layer: currentLayer, vertices: [] };
                    i++; continue;
                }

                if (inEntitiesSection && currentEntity) {
                    const groupCode = parseInt(code, 10);
                    if (groupCode === 8) {
                        currentLayer = val.toUpperCase();
                        currentEntity.layer = currentLayer;
                    } else if (groupCode === 10) {
                        currentEntity.currentX = parseFloat(val);
                    } else if (groupCode === 20) {
                        currentEntity.currentY = parseFloat(val);
                        if (currentEntity.type === 'LWPOLYLINE' || currentEntity.type === 'VERTEX') {
                            currentEntity.vertices.push({ x: currentEntity.currentX, y: currentEntity.currentY });
                        }
                    } else if (groupCode === 11) {
                        currentEntity.x2 = parseFloat(val);
                    } else if (groupCode === 21) {
                        currentEntity.y2 = parseFloat(val);
                        if (currentEntity.type === 'LINE') {
                            currentEntity.vertices = [
                                { x: currentEntity.currentX, y: currentEntity.currentY },
                                { x: currentEntity.x2, y: currentEntity.y2 }
                            ];
                        }
                    } else if (groupCode === 70) {
                        currentEntity.closed = (parseInt(val, 10) & 1) !== 0;
                    }
                    i++;
                }
            }
            if (currentEntity) entities.push(currentEntity);

            let panelSegments = [];
            let boardLoops = [];

            let hasPanelLayer = false;
            let hasBoardLayer = false;
            let hasSlitLayer = false;
            let hasTabLayer = false;

            entities.forEach(ent => {
                const lName = ent.layer || "0";
                if (lName.includes('PANEL') || lName.includes('FRAME')) {
                    hasPanelLayer = true;
                    if (ent.type === 'LINE' && ent.vertices.length === 2) panelSegments.push(ent.vertices);
                    else if (ent.type === 'LWPOLYLINE' && ent.vertices.length > 1) {
                        for (let j = 0; j < ent.vertices.length - 1; j++) panelSegments.push([ent.vertices[j], ent.vertices[j+1]]);
                        if (ent.closed) panelSegments.push([ent.vertices[ent.vertices.length - 1], ent.vertices[0]]);
                    }
                }
                if (lName.includes('BOARD') || lName.includes('PCS') || lName.includes('PCB')) {
                    hasBoardLayer = true;
                    if (ent.type === 'LWPOLYLINE' && ent.vertices.length > 2) {
                        boardLoops.push(ent.vertices);
                    }
                }
                if (lName.includes('SLIT') || lName.includes('ROUTER')) {
                    hasSlitLayer = true;
                }
                if (lName.includes('TAB') || lName.includes('BITE')) {
                    hasTabLayer = true;
                }
            });

            document.getElementById('tag-panel').classList.toggle('active', hasPanelLayer);
            document.getElementById('tag-board').classList.toggle('active', hasBoardLayer);
            document.getElementById('tag-slit').classList.toggle('active', hasSlitLayer);
            document.getElementById('tag-tab').classList.toggle('active', hasTabLayer);

            const panelLoops = findClosedLoops(panelSegments);
            let outerLoop = panelLoops.length > 0 ? panelLoops[0] : [
                { x: -100, y: -75 }, { x: 100, y: -75 }, { x: 100, y: 75 }, { x: -100, y: 75 }
            ];

            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            outerLoop.forEach(p => {
                if (p.x < minX) minX = p.x;
                if (p.x > maxX) maxX = p.x;
                if (p.y < minY) minY = p.y;
                if (p.y > maxY) maxY = p.y;
            });

            const centerX = (minX + maxX) / 2 || 0;
            const centerY = (minY + maxY) / 2 || 0;

            const centeredOuter = outerLoop.map(p => ({ x: p.x - centerX, y: p.y - centerY }));
            const pWidth = Math.round((Math.max(...outerLoop.map(p=>p.x)) - Math.min(...outerLoop.map(p=>p.x))) * 10) / 10;
            const pHeight = Math.round((Math.max(...outerLoop.map(p=>p.y)) - Math.min(...outerLoop.map(p=>p.y))) * 10) / 10;

            const detectedPcs = Math.max(1, boardLoops.length);

            let centeredBoards = [];
            boardLoops.forEach(bLoop => {
                centeredBoards.push(bLoop.map(p => ({ x: p.x - centerX, y: p.y - centerY })));
            });

            const outerArea = Math.abs(polygonArea(centeredOuter));
            let boardAreaSum = 0;
            centeredBoards.forEach(b => boardAreaSum += Math.abs(polygonArea(b)));
            const netArea = Math.max(1, outerArea);
            const cutoutRatio = ((boardAreaSum / Math.max(1, outerArea)) * 100).toFixed(1);

            parsedDXF = {
                width: pWidth > 10 ? pWidth : 200,
                height: pHeight > 10 ? pHeight : 150,
                pcsCount: detectedPcs,
                slitWidth: 2.0,
                outerPoly: centeredOuter,
                boardLoops: centeredBoards,
                totalArea: netArea > 100 ? netArea : 30000,
                cutoutRatio: cutoutRatio
            };

            document.getElementById('info-panel-size').innerText = `${parsedDXF.width} × ${parsedDXF.height} mm`;
            document.getElementById('info-pcs-count').innerText = `${parsedDXF.pcsCount} pcs (レイヤー検出)`;
            document.getElementById('info-slit-width').innerText = `2.0 mm`;
            document.getElementById('info-cutout-ratio').innerText = `${parsedDXF.cutoutRatio} %`;
        }

        function polygonArea(poly) {
            let area = 0;
            for (let i = 0; i < poly.length; i++) {
                let j = (i + 1) % poly.length;
                area += poly[i].x * poly[j].y;
                area -= poly[j].x * poly[i].y;
            }
            return area / 2;
        }

        function findClosedLoops(segments) {
            let loops = [];
            let unvisited = [...segments];
            const tolerance = 0.5;

            while (unvisited.length > 0) {
                let currentLoop = [];
                let seg = unvisited.shift();
                currentLoop.push(seg[0]);
                let currentPt = seg[1];

                let foundNext = true;
                while (foundNext && unvisited.length > 0) {
                    foundNext = false;
                    for (let i = 0; i < unvisited.length; i++) {
                        const s = unvisited[i];
                        if (dist2D(currentPt, s[0]) < tolerance) {
                            currentLoop.push(currentPt);
                            currentPt = s[1];
                            unvisited.splice(i, 1);
                            foundNext = true;
                            break;
                        } else if (dist2D(currentPt, s[1]) < tolerance) {
                            currentLoop.push(currentPt);
                            currentPt = s[0];
                            unvisited.splice(i, 1);
                            foundNext = true;
                            break;
                        }
                    }
                    if (dist2D(currentPt, currentLoop[0]) < tolerance) {
                        loops.push(currentLoop);
                        break;
                    }
                }
            }
            return loops;
        }

        function dist2D(p1, p2) {
            return Math.sqrt((p1.x - p2.x)**2 + (p1.y - p2.y)**2);
        }

        function createDefaultBoardGeometry() {
            const w = 200, h = 150;
            // デフォルト6面付（2x3配列）のサンプル
            parsedDXF = {
                width: w, height: h, pcsCount: 6, slitWidth: 2.0,
                outerPoly: [{ x: -100, y: -75 }, { x: 100, y: -75 }, { x: 100, y: 75 }, { x: -100, y: 75 }],
                boardLoops: [
                    [{ x: -90, y: 10 }, { x: -35, y: 10 }, { x: -35, y: 65 }, { x: -90, y: 65 }],
                    [{ x: -25, y: 10 }, { x: 25, y: 10 }, { x: 25, y: 65 }, { x: -25, y: 65 }],
                    [{ x: 35, y: 10 }, { x: 90, y: 10 }, { x: 90, y: 65 }, { x: 35, y: 65 }],
                    [{ x: -90, y: -65 }, { x: -35, y: -65 }, { x: -35, y: -10 }, { x: -90, y: -10 }],
                    [{ x: -25, y: -65 }, { x: 25, y: -65 }, { x: 25, y: -10 }, { x: -25, y: -10 }],
                    [{ x: 35, y: -65 }, { x: 90, y: -65 }, { x: 90, y: -10 }, { x: 35, y: -10 }]
                ],
                totalArea: 30000, cutoutRatio: 15.0
            };

            document.getElementById('info-panel-size').innerText = `${w} × ${h} mm`;
            document.getElementById('info-pcs-count').innerText = `6 pcs (標準)`;
            document.getElementById('info-slit-width').innerText = `2.0 mm`;
            document.getElementById('info-cutout-ratio').innerText = `15.0 %`;

            runSimulation();
        }

        // --- 物理演算 & 3Dレンダリング (フレーム＋独立個片基板の同時描画) ---
        function runSimulation() {
            const matType = document.getElementById('mat-type').value;
            const thickness = parseFloat(document.getElementById('board-thick').value);
            const copperThickness = parseFloat(document.getElementById('copper-thick').value) / 1000;
            const cuDiff = parseFloat(document.getElementById('cu-ratio-diff').value) / 100;
            const compWeightPerPcs = parseFloat(document.getElementById('comp-weight').value);
            const reflowTemp = parseFloat(document.getElementById('reflow-temp').value);
            const support = document.getElementById('support-type').value;

            let E_base = 22000;
            let cte_base = 14e-6;
            if (reflowTemp > 170) {
                E_base = (matType === 'fr4_high_tg') ? 9500 : (matType === 'polyimide' ? 14000 : 4500);
                cte_base = (matType === 'polyimide') ? 22e-6 : 60e-6;
            }

            const deltaT = reflowTemp - 25;
            const thermalMismatch = (17e-6 - cte_base) * deltaT;
            const thermalCurvature = (thermalMismatch * cuDiff * (copperThickness / thickness)) / (thickness * 0.5);

            const totalCompMassGram = compWeightPerPcs * parsedDXF.pcsCount;
            const boardDensity = 1.9e-3;
            const boardMassGram = parsedDXF.totalArea * thickness * boardDensity;
            const totalWeightGram = totalCompMassGram + boardMassGram;
            const totalForceN = (totalWeightGram / 1000) * 9.81;

            const stiffnessReduction = Math.max(0.25, 1.0 - (parsedDXF.pcsCount * 0.06));
            const I_panel = (parsedDXF.width * Math.pow(thickness, 3) / 12) * stiffnessReduction;

            const L = (support === '2edge') ? parsedDXF.height : Math.min(parsedDXF.width, parsedDXF.height);
            const gravityDeflection = (5 * totalForceN * Math.pow(L, 3)) / (384 * E_base * I_panel);

            const maxWarpageZ = Math.abs(thermalCurvature * Math.pow(L, 2) / 8) + gravityDeflection;
            const diagonalLength = Math.sqrt(Math.pow(parsedDXF.width, 2) + Math.pow(parsedDXF.height, 2));
            const warpageRatio = (maxWarpageZ / diagonalLength) * 100;

            document.getElementById('res-total-weight').innerText = `${totalWeightGram.toFixed(1)} g (基板:${boardMassGram.toFixed(0)}g + 部品:${totalCompMassGram.toFixed(0)}g)`;
            document.getElementById('res-warpage-mm').innerText = `${maxWarpageZ.toFixed(2)} mm`;
            document.getElementById('res-warpage-ratio').innerText = `${warpageRatio.toFixed(2)} %`;

            const badge = document.getElementById('res-badge');
            if (warpageRatio <= 0.5) {
                badge.className = 'judge-badge judge-ok';
                badge.innerHTML = '<i class="fa-solid fa-circle-check"></i> 判定: 良好 (合致)';
            } else if (warpageRatio <= 0.75) {
                badge.className = 'judge-badge judge-warn';
                badge.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> 判定: 許容内 (注意)';
            } else {
                badge.className = 'judge-badge judge-ng';
                badge.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> 判定: 規格超過 (NG)';
            }

            build3DWarpedMesh(maxWarpageZ, thickness);
        }

        function build3DWarpedMesh(maxZ, boardThickness) {
            while (pcbGroup.children.length > 0) {
                const child = pcbGroup.children[0];
                if (child.geometry) child.geometry.dispose();
                pcbGroup.remove(child);
            }

            // 1. フレーム部分（パネル外形から全個片基板の領域を穴抜きしたシェイプ）
            const frameShape = new THREE.Shape();
            const outer = parsedDXF.outerPoly;

            if (outer.length > 0) {
                frameShape.moveTo(outer[0].x, outer[0].y);
                for (let i = 1; i < outer.length; i++) frameShape.lineTo(outer[i].x, outer[i].y);
                frameShape.closePath();
            }

            parsedDXF.boardLoops.forEach(bLoop => {
                if (bLoop.length > 2) {
                    const holePath = new THREE.Path();
                    holePath.moveTo(bLoop[0].x, bLoop[0].y);
                    for (let i = 1; i < bLoop.length; i++) holePath.lineTo(bLoop[i].x, bLoop[i].y);
                    holePath.closePath();
                    frameShape.holes.push(holePath);
                }
            });

            const frameGeo = new THREE.ExtrudeGeometry(frameShape, { depth: boardThickness, bevelEnabled: false, curveSegments: 16, steps: 1 });
            frameGeo.center();

            const halfW = parsedDXF.width / 2;
            const halfH = parsedDXF.height / 2;
            const colorRamp = [
                new THREE.Color(0x0000ff), new THREE.Color(0x00ffff),
                new THREE.Color(0x00ff00), new THREE.Color(0xffff00), new THREE.Color(0xff0000)
            ];

            // フレーム頂点の反り変形 ＆ コンター彩色
            const fPos = frameGeo.attributes.position;
            const fColors = [];
            for (let i = 0; i < fPos.count; i++) {
                const x = fPos.getX(i);
                const y = fPos.getY(i);
                const nx = x / (halfW || 1);
                const ny = y / (halfH || 1);
                const visualZ = ((nx * nx + ny * ny) / 2.0) * (maxZ * 2.5);

                fPos.setZ(i, fPos.getZ(i) + visualZ);

                const t = Math.min(Math.max(visualZ / Math.max(0.1, maxZ * 2.5), 0), 1);
                const colorIdx = t * (colorRamp.length - 1);
                const baseIdx = Math.floor(colorIdx);
                const lerpFactor = colorIdx - baseIdx;
                const c1 = colorRamp[baseIdx];
                const c2 = colorRamp[Math.min(baseIdx + 1, colorRamp.length - 1)];
                const finalCol = c1.clone().lerp(c2, lerpFactor);
                fColors.push(finalCol.r, finalCol.g, finalCol.b);
            }
            frameGeo.setAttribute('color', new THREE.Float32BufferAttribute(fColors, 3));
            frameGeo.computeVertexNormals();

            const frameMesh = new THREE.Mesh(frameGeo, new THREE.MeshStandardMaterial({
                vertexColors: true, side: THREE.DoubleSide, roughness: 0.35, metalness: 0.25, wireframe: isWireframe
            }));
            frameMesh.rotation.x = -Math.PI / 2;
            pcbGroup.add(frameMesh);

            // 2. 個片基板（BOARD_OUTLINE）部分を独立したメッシュとして生成（黄色で表示）
            parsedDXF.boardLoops.forEach(bLoop => {
                const bShape = new THREE.Shape();
                bShape.moveTo(bLoop[0].x, bLoop[0].y);
                for (let i = 1; i < bLoop.length; i++) bShape.lineTo(bLoop[i].x, bLoop[i].y);
                bShape.closePath();

                const bGeo = new THREE.ExtrudeGeometry(bShape, { depth: boardThickness, bevelEnabled: false, curveSegments: 12, steps: 1 });
                bGeo.center();

                const bPos = bGeo.attributes.position;
                const bColors = [];
                for (let i = 0; i < bPos.count; i++) {
                    const x = bPos.getX(i);
                    const y = bPos.getY(i);
                    const nx = x / (halfW || 1);
                    const ny = y / (halfH || 1);
                    const visualZ = ((nx * nx + ny * ny) / 2.0) * (maxZ * 2.5);

                    bPos.setZ(i, bPos.getZ(i) + visualZ + 0.1); // わずかに浮かせて隙間を強調

                    // 個片基板は識別しやすいよう黄色のベースにコンターの陰影をブレンド
                    const baseYellow = new THREE.Color(0xffd166);
                    bColors.push(baseYellow.r, baseYellow.g, baseYellow.b);
                }
                bGeo.setAttribute('color', new THREE.Float32BufferAttribute(bColors, 3));
                bGeo.computeVertexNormals();

                const bMesh = new THREE.Mesh(bGeo, new THREE.MeshStandardMaterial({
                    vertexColors: true, side: THREE.DoubleSide, roughness: 0.25, metalness: 0.1, wireframe: isWireframe
                }));
                bMesh.rotation.x = -Math.PI / 2;
                pcbGroup.add(bMesh);
            });

            controls.target.set(0, 0, 0);
        }

        // --- レイヤー別サンプルDXF出力ツール (2x3配列) ---
        function downloadLayeredSampleDXF() {
            const dxfContent = `0\nSECTION\n2\nHEADER\n0\nENDSEC\n0\nSECTION\n2\nTABLES\n0\nTABLE\n2\nLAYER\n70\n5\n0\nLAYER\n2\nPANEL_OUTLINE\n70\n0\n62\n7\n0\nLAYER\n2\nBOARD_OUTLINE\n70\n0\n62\n3\n0\nLAYER\n2\nSLIT\n70\n0\n62\n1\n0\nLAYER\n2\nTAB_PERF\n70\n0\n62\n5\n0\nENDTAB\n0\nENDSEC\n0\nSECTION\n2\nENTITIES\n0\nLWPOLYLINE\n8\nPANEL_OUTLINE\n90\n4\n70\n1\n10\n-100.0\n20\n-75.0\n10\n100.0\n20\n-75.0\n10\n100.0\n20\n75.0\n10\n-100.0\n20\n75.0\n0\nLWPOLYLINE\n8\nBOARD_OUTLINE\n90\n4\n70\n1\n10\n-90.0\n20\n10.0\n10\n-35.0\n20\n10.0\n10\n-35.0\n20\n65.0\n10\n-90.0\n20\n65.0\n0\nLWPOLYLINE\n8\nBOARD_OUTLINE\n90\n4\n70\n1\n10\n-25.0\n20\n10.0\n10\n25.0\n20\n10.0\n10\n25.0\n20\n65.0\n10\n-25.0\n20\n65.0\n0\nLWPOLYLINE\n8\nBOARD_OUTLINE\n90\n4\n70\n1\n10\n35.0\n20\n10.0\n10\n90.0\n20\n10.0\n10\n90.0\n20\n65.0\n10\n35.0\n20\n65.0\n0\nLWPOLYLINE\n8\nBOARD_OUTLINE\n90\n4\n70\n1\n10\n-90.0\n20\n-65.0\n10\n-35.0\n20\n-65.0\n10\n-35.0\n20\n-10.0\n10\n-90.0\n20\n-10.0\n0\nLWPOLYLINE\n8\nBOARD_OUTLINE\n90\n4\n70\n1\n10\n-25.0\n20\n-65.0\n10\n25.0\n20\n-65.0\n10\n25.0\n20\n-10.0\n10\n-25.0\n20\n-10.0\n0\nLWPOLYLINE\n8\nBOARD_OUTLINE\n90\n4\n70\n1\n10\n35.0\n20\n-65.0\n10\n90.0\n20\n-65.0\n10\n90.0\n20\n-10.0\n10\n35.0\n20\n-10.0\n0\nLINE\n8\nSLIT\n10\n-35.0\n20\n10.0\n11\n-25.0\n20\n10.0\n0\nLINE\n8\nTAB_PERF\n10\n-62.5\n20\n65.0\n11\n-62.5\n20\n75.0\n0\nENDSEC\n0\nEOF`;

            const blob = new Blob([dxfContent], { type: 'application/dxf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'layered_sample_2x3.dxf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
